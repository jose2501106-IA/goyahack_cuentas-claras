<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">La Central, por sectores</title>
  <desc id="d">Esquema ilustrativo, no a escala: cinco sectores de la Central de Abasto; dentro de Abarrotes y Víveres, una nota firmada viaja de la Bodega A a la Bodega B con permiso del cliente.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/>
    </marker>
    <style>
      .tit{font-family:Archivo,'Arial Black',Arial,sans-serif;font-weight:800;fill:#1E3A8A}
      .txt{font-family:'Atkinson Hyperlegible',Arial,sans-serif;fill:#262626}
      .sec{font-family:Archivo,Arial,sans-serif;font-weight:700;fill:#1E3A8A}
      .pie{font-family:'Atkinson Hyperlegible',Arial,sans-serif;fill:#5F5F5F}
      .mono{font-family:'IBM Plex Mono','Courier New',monospace;fill:#1E3A8A}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F5F0E6"/>

  <text x="120" y="150" class="tit" font-size="72">La Central, por sectores</text>
  <text x="120" y="215" class="txt" font-size="34">La nota viaja entre bodegas. La ubicación nunca va a la cadena.</text>

  <!-- Frutas y Legumbres -->
  <rect x="120" y="290" width="760" height="430" rx="18" fill="#D8C3A0"/>
  <text x="160" y="360" class="sec" font-size="40">Frutas y Legumbres</text>
  <text x="160" y="410" class="txt" font-size="30">1,981 bodegas</text>

  <!-- Abarrotes y Víveres (destacado) -->
  <rect x="920" y="290" width="880" height="430" rx="18" fill="#E8EEF9" stroke="#1E3A8A" stroke-width="4"/>
  <text x="960" y="360" class="sec" font-size="40">Abarrotes y Víveres</text>
  <text x="960" y="410" class="txt" font-size="30">347 bodegas · aquí arrancaría el piloto</text>

  <rect x="990" y="470" width="250" height="160" rx="12" fill="#F5F0E6" stroke="#1E3A8A" stroke-width="3"/>
  <text x="1115" y="545" class="sec" font-size="32" text-anchor="middle">Bodega A</text>
  <text x="1115" y="595" class="pie" font-size="24" text-anchor="middle">emite la nota</text>

  <rect x="1480" y="470" width="250" height="160" rx="12" fill="#F5F0E6" stroke="#1E3A8A" stroke-width="3"/>
  <text x="1605" y="545" class="sec" font-size="32" text-anchor="middle">Bodega B</text>
  <text x="1605" y="590" class="pie" font-size="24" text-anchor="middle">consulta con</text>
  <text x="1605" y="618" class="pie" font-size="24" text-anchor="middle">permiso</text>

  <path d="M1250,550 C1320,480 1400,480 1470,550" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#flecha)"/>
  <!-- sello -->
  <g transform="translate(1360,640) rotate(-12)">
    <circle r="58" fill="none" stroke="#B3261E" stroke-width="5"/>
    <circle r="48" fill="none" stroke="#B3261E" stroke-width="2"/>
    <text y="8" text-anchor="middle" font-family="Archivo,Arial,sans-serif" font-weight="800" font-size="15" fill="#B3261E">CUMPLIDA</text>
  </g>
  <text x="1360" y="468" class="mono" font-size="22" text-anchor="middle">historial del cliente</text>

  <!-- Sectores inferiores -->
  <rect x="120" y="760" width="540" height="150" rx="18" fill="#D8C3A0"/>
  <text x="160" y="850" class="sec" font-size="34">Flores y Hortalizas</text>
  <rect x="690" y="760" width="540" height="150" rx="18" fill="#D8C3A0"/>
  <text x="730" y="850" class="sec" font-size="34">Subasta y Productores</text>
  <rect x="1260" y="760" width="540" height="150" rx="18" fill="#D8C3A0"/>
  <text x="1300" y="850" class="sec" font-size="34">Aves y Cárnicos</text>

  <text x="120" y="990" class="pie" font-size="22">Esquema ilustrativo: no está a escala ni muestra ubicaciones reales. Sectores: plano de la CEDA (2025).</text>
  <text x="120" y="1024" class="pie" font-size="22">Número de bodegas: FICEDA, sectores de actividad (H-01). Bodega A y Bodega B: datos ficticios de la demo.</text>
</svg>
