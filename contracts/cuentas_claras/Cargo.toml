[package]
name = "cuentas_claras"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# Versión fija (decisión #41): CLI stellar 28.0.0 → soroban-sdk 28.x. No mezclar con 27.x.
# Cero crates fuera de soroban-sdk (regla del proyecto; riesgo de cadena de suministro).
soroban-sdk = "=28.0.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
